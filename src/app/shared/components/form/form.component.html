<form [formGroup]="form" (ngSubmit)="handleSubmit()" class="m-2 grid gap-2">
  <div class="grid gap-2">
    <label for="name">Nombre: </label>
    <input
      type="text"
      placeholder="Ingrese su nombre"
      id="name"
      formControlName="name"
      formInputStyle
      errorMessagesInput
    />
  </div>
  <div class="grid gap-2">
    <label for="surname">Apellidos: </label>
    <input
      type="text"
      placeholder="Ingrese sus apellidos"
      id="surname"
      formControlName="surname"
      formInputStyle
      errorMessagesInput
    />
  </div>
  <div class="grid gap-2">
    <label for="name">Email: </label>
    <input
      type="email"
      placeholder="Ingrese su correo"
      id="email"
      formControlName="email"
      formInputStyle
      [maxWidth]="'20rem'"
      errorMessagesInput
    />
  </div>
  <div class="flex gap-4 mt-6">
    <app-button (clickEmitter)="handleClear()" [isDisabled]="!hasAnyValue" customClass="bg-red-500">
      Cancelar
    </app-button>
    <app-button
      type="submit"
      customClass="bg-green-500"
      [isSubmit]="true"
      [isDisabled]="form.invalid">
      Agregar
    </app-button>
  </div>
</form>
