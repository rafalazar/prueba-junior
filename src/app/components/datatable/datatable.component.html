<div
  class="flex flex-col text-slate-300 bg-slate-800 shadow-md rounded-lg bg-clip-border mt-3">
  <table class="w-full text-left table-auto min-w-max">
    <thead>
      <tr>
        <th class="p-4 border-b border-slate-600 bg-slate-700">
          <p class="text-sm font-normal leading-none text-slate-300">Nombre</p>
        </th>
        <th class="p-4 border-b border-slate-600 bg-slate-700">
          <p class="text-sm font-normal leading-none text-slate-300">
            Apellido
          </p>
        </th>
        <th class="p-4 border-b border-slate-600 bg-slate-700">
          <p class="text-sm font-normal leading-none text-slate-300">Correo</p>
        </th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id; let idx = $index) {
        <tr class="hover:bg-slate-700">
          <td class="p-4 border-b border-slate-700">
            <p class="text-sm text-slate-100 font-semibold">{{user.name}}</p>
          </td>
          <td class="p-4 border-b border-slate-700">
            <p class="text-sm text-slate-300">{{user.surname}}</p>
          </td>
          <td class="p-4 border-b border-slate-700">
            <p class="text-sm text-slate-300">{{user.email}}</p>
          </td>
      </tr>
      }
    </tbody>
  </table>
</div>
